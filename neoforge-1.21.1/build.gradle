// RS Polymorph, NeoForge 1.21.1. A standalone Gradle project: build it from this folder.
// The loader-independent code for this Minecraft version lives in ../common/1.21.1.
//
// Author: vyrriox

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

def commonDir = file("../common/${minecraft_version}/src/main")
sourceSets.main {
    java.srcDir(new File(commonDir, 'java'))
    resources.srcDir(new File(commonDir, 'resources'))
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${minecraft_version})"
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Refined Storage 2.0.8 for NeoForge, pinned by its Modrinth version id: the same version number
    // also exists for Fabric. Provided at runtime by the player's modpack. No Polymorph dependency.
    implementation "maven.modrinth:refined-storage:${refinedstorage_neoforge}"
}

processResources {
    def props = [
            version                      : mod_version,
            group                        : project.group,
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version             : neoforge_version,
            neoforge_loader_version_range: neoforge_loader_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_author                   : mod_author,
            license                      : license,
            description                  : project.description,
            credits                      : credits,
            java_version                 : java_version,
            refinedstorage_version_range : refinedstorage_version_range,
            quartz_arsenal_version_range : quartz_arsenal_version_range,
    ]
    inputs.properties(props)
    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml', '*.mixins.json']) { expand props }
}

jar {
    from(file('../LICENSE')) { rename { "${it}_${mod_name}" } }
    from(file('../NOTICE')) { rename { "${it}_${mod_name}" } }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : 'neoforge',
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
        ])
    }
}

sourcesJar {
    from(file('../LICENSE')) { rename { "${it}_${mod_name}" } }
}
