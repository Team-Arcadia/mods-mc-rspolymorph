name: Build & Test

on:
  push:
    branches: [ main, neoforge-1.21.1, fabric-1.21.1, neoforge-26.1.2 ]
    paths:
      - 'common/**'
      - 'neoforge-1.21.1/**'
      - 'neoforge-26.1.2/**'
      - 'fabric-1.21.1/**'
      - 'fabric-26.1.2/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, neoforge-1.21.1, fabric-1.21.1, neoforge-26.1.2 ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each target is a standalone Gradle project. fabric-26.1.2 joins once it builds (issue #5).
        include:
          - target: neoforge-1.21.1
            java: '21'
          - target: fabric-1.21.1
            java: '21'
          - target: neoforge-26.1.2
            java: '25'

    defaults:
      run:
        working-directory: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: rspolymorph-${{ matrix.target }}-${{ github.ref_name }}
          path: ${{ matrix.target }}/build/libs/rspolymorph-${{ matrix.target }}-*.jar
          retention-days: 30
