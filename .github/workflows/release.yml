name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  # The matrix of targets lives in build.yml.
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every jar
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: bash tools/release_notes.sh "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      # One explicit path per row of tools/targets.tsv, so a missing jar fails the release.
      - name: List the jars
        id: jars
        run: |
          {
            echo 'files<<EOF_FILES'
            grep -v '^#' tools/targets.tsv | cut -f1 | while read -r target; do
              echo "dist/rspolymorph-$target-${GITHUB_REF_NAME#v}.jar"
            done
            echo 'EOF_FILES'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: ${{ steps.jars.outputs.files }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
