name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            21
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Each target is a standalone Gradle project; Gradle toolchains pick Java 21 or 25 per target.
      - name: Build every target
        run: |
          for target in neoforge-1.21.1 fabric-1.21.1 neoforge-26.1.2; do
            (cd "$target" && ./gradlew build --no-daemon)
          done

      - name: Generate release notes
        run: |
          V=${{ steps.version.outputs.VERSION }}
          {
            echo "## RS Polymorph v$V"
            echo ""
            echo "### Downloads"
            echo "- rspolymorph-neoforge-1.21.1-$V.jar: Minecraft 1.21.1, NeoForge 21.1.219+, Refined Storage 2.x"
            echo "- rspolymorph-fabric-1.21.1-$V.jar: Minecraft 1.21.1, Fabric Loader 0.16.10+ and Fabric API, Refined Storage 2.x"
            echo "- rspolymorph-neoforge-26.1.2-$V.jar: Minecraft 26.1.2, NeoForge 26.1.2, Refined Storage 3.x"
            echo ""
            echo "No Polymorph needed. Optional: Refined Storage - Quartz Arsenal 1.0.7+ for its Wireless Crafting Grid."
            echo ""
            echo "See [CHANGELOG.md](CHANGELOG.md) for full details."
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            neoforge-1.21.1/build/libs/rspolymorph-neoforge-1.21.1-${{ steps.version.outputs.VERSION }}.jar
            fabric-1.21.1/build/libs/rspolymorph-fabric-1.21.1-${{ steps.version.outputs.VERSION }}.jar
            neoforge-26.1.2/build/libs/rspolymorph-neoforge-26.1.2-${{ steps.version.outputs.VERSION }}.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
