text.fr = 'RS Polymorph est fait par la Team Arcadia. Rejoignez notre modpack et retrouvez son serveur, le <a href="https://www.arcadia-echoes-of-power.fr/">site</a> et le <a href="https://www.arcadia-echoes-of-power.fr/wiki">wiki</a>.'
image = "https://arcadia-echoes-of-power.fr/storage/curseforge/serveur.gif"
