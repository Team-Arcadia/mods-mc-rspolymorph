// RS Polymorph, NeoForge 1.20.4. A standalone Gradle project: build it from this folder (Java 17).
//
// Shares ../common/1.20.1, minus the files the 1.20.2 RecipeHolder change forks in ../common/1.20.4.
//
// Author: vyrriox

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

def sharedDir = file('../common/1.20.1/src/main')
def forkDir = file("../common/${minecraft_version}/src/main")

// Files of ../common/1.20.1 replaced by a fork in ../common/1.20.4.
def forkedFor1204 = [
        // Recipes no longer know their id: RecipeManager lookups go through RecipeHolder.
        'com/vyrriox/rspolymorph/RecipeAccess.java',
        'com/vyrriox/rspolymorph/client/GridRecipeWidget.java',
        'com/vyrriox/rspolymorph/mixin/MixinGridNetworkNodePattern.java',
]

def assembledJava = layout.buildDirectory.dir('assembled-common/java')
def assembleCommonSources = tasks.register('assembleCommonSources', Sync) {
    from(new File(sharedDir, 'java')) {
        forkedFor1204.each { exclude it }
    }
    from(new File(forkDir, 'java'))
    into assembledJava
    duplicatesStrategy = DuplicatesStrategy.FAIL   // a fork colliding with a shared file is a bug
}

// The fork of the mixin config drops the refmap: this target runs on Mojang names.
def assembledResources = layout.buildDirectory.dir('assembled-common/resources')
def assembleCommonResources = tasks.register('assembleCommonResources', Sync) {
    from(new File(sharedDir, 'resources')) {
        exclude 'rspolymorph-common.mixins.json'
    }
    from(new File(forkDir, 'resources'))
    into assembledResources
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

sourceSets.main {
    java.srcDir(assembledJava)
    resources.srcDir(assembledResources)
}

tasks.named('compileJava') { dependsOn assembleCommonSources }
tasks.named('processResources') { dependsOn assembleCommonResources }

neoForge {
    version = neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Dedicated server side (no client classes, no client mixins) that stops by itself.
        gametest {
            type = 'gameTestServer'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
            // -PauditMixins applies every mixin at startup instead of on the first use of its target.
            if (providers.gradleProperty('auditMixins').isPresent()) {
                systemProperty 'rspolymorph.auditMixins', 'true'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "maven.modrinth:refined-storage:${refinedstorage_version_id}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range     : minecraft_version_range,
            neoforge_version_range      : neoforge_version_range,
            loader_version_range        : loader_version_range,
            refinedstorage_version_range: refinedstorage_version_range,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_author                  : mod_author,
            mod_version                 : mod_version,
            mod_license                 : mod_license,
            mod_credits                 : mod_credits,
            mod_description             : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(file('../LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
    from(file('../NOTICE')) {
        rename { "NOTICE_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_author,
        ])
    }
}
