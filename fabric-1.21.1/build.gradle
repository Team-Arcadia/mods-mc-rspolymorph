// RS Polymorph, Fabric 1.21.1. A standalone Gradle project: build it from this folder.
// The loader-independent code for this Minecraft version lives in ../common/1.21.1.
//
// Author: vyrriox

plugins {
    id 'java-library'
    id 'fabric-loom' version '1.16.3'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

def commonDir = file("../common/${minecraft_version}/src/main")
sourceSets.main {
    java.srcDir(new File(commonDir, 'java'))
    resources.srcDir(new File(commonDir, 'resources'))
}

// In-game functional test, only with -Pselftest (see docs/BUILDING.md). A default build compiles and
// packages none of it. The jar gets another name, so that it can never pass for a release.
def selftest = project.hasProperty('selftest')
// Selftest only: run against another Refined Storage jar. The code still compiles against the pinned
// version, as a released jar would, and the version floor is lifted because development jars are 0.0.0.
def rsJar = selftest ? project.findProperty('rs_jar') : null
if (selftest) {
    def selftestDir = file("../common/${minecraft_version}/src/selftest")
    sourceSets.main {
        java.srcDir(new File(selftestDir, 'java'))
        resources.srcDir(new File(selftestDir, 'resources'))
    }
    base.archivesName = "${base.archivesName.get()}-SELFTEST"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Refined Storage 2.0.8 for Fabric, pinned by its Modrinth version id: the same version number
    // also exists for NeoForge. No Polymorph dependency.
    if (rsJar) {
        modCompileOnly "maven.modrinth:refined-storage:${refinedstorage_fabric}"
        modLocalRuntime files(rsJar)
    } else {
        modImplementation "maven.modrinth:refined-storage:${refinedstorage_fabric}"
    }

    // Refined Storage nests these two in its jar for players, but Loom strips nested jars from a
    // dependency: the development runs need them next to it (the same versions as RS 2.0.9 nests).
    modLocalRuntime "maven.modrinth:cloth-config:HpMb5wGb"
    modLocalRuntime "teamreborn:energy:4.1.0"
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        if (selftest) {
            clientSelftest {
                client()
                setConfigName('Fabric Client Selftest')
                runDir('runs/selftest')
                vmArg('-Drspolymorph.selftest=true')
            }
            // The dedicated server distribution, through the game test launch: needs no EULA.
            serverSelftest {
                server()
                runDir('runs/selftest-server')
                vmArg('-Dfabric-api.gametest')
                vmArg('-Drspolymorph.selftest.server=true')
                vmArg('-Xlog:class+load=info:file=rspolymorph-selftest-classload.log')
            }
        }
    }
}

processResources {
    def props = [
            version                     : mod_version,
            group                       : project.group,
            minecraft_version           : minecraft_version,
            minecraft_version_range     : minecraft_version_range,
            fabric_version              : fabric_version,
            fabric_loader_version       : fabric_loader_version,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_author                  : mod_author,
            license                     : license,
            description                 : project.description,
            credits                     : credits,
            java_version                : java_version,
            refinedstorage_min_version : rsJar ? '0.0.0' : refinedstorage_min_version,
            quartz_arsenal_version_range: quartz_arsenal_version_range,
    ]
    inputs.properties(props)
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) { expand props }
    if (selftest) {
        // A second mixin config, for the selftest only.
        filesMatching('fabric.mod.json') {
            filter { String line ->
                line.trim() == '"rspolymorph-common.mixins.json"'
                        ? line + ',\n    "rspolymorph-selftest.mixins.json"' : line
            }
        }
    }
}

jar {
    from(file('../LICENSE')) { rename { "${it}_${mod_name}" } }
    from(file('../NOTICE')) { rename { "${it}_${mod_name}" } }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : 'fabric',
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
        ])
    }
}

sourcesJar {
    from(file('../LICENSE')) { rename { "${it}_${mod_name}" } }
}
