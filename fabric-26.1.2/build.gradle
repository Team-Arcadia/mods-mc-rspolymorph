// RS Polymorph, Fabric 26.1.2. A standalone Gradle project. Minecraft 26.x ships unobfuscated, so
// this is the non-remapping Loom plugin: no mappings, and mods are plain implementation dependencies.
//
// The sources are assembled like neoforge-26.1.2: ../common/1.21.1 with the 26.x renames, plus the
// forks in ../common/26.1.2.
//
// Author: vyrriox

plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

def sharedDir = file('../common/1.21.1/src/main')
def forkDir = file("../common/${minecraft_version}/src/main")

// Keep in step with the list of neoforge-26.1.2/build.gradle.
def forkedFor261 = [
        'com/vyrriox/rspolymorph/mixin/MixinPatternResolver.java',
        'com/vyrriox/rspolymorph/RsPolymorph.java',
        'com/vyrriox/rspolymorph/client/RsGridRecipeWidget.java',
        'com/vyrriox/rspolymorph/client/RecipeSelectorPopup.java',
        'com/vyrriox/rspolymorph/client/TutorialOverlay.java',
        'com/vyrriox/rspolymorph/client/RecipeSelectionSideButton.java',
        'com/vyrriox/rspolymorph/mixin/MixinAbstractGridScreenRender.java',
        'com/vyrriox/rspolymorph/mixin/MixinScreenPopupRender.java',
        'com/vyrriox/rspolymorph/mixin/MixinAbstractContainerScreenOffset.java',
        'com/vyrriox/rspolymorph/mixin/MixinScreenTooltipSuppress.java',
        // 26.x key handling takes a KeyEvent, not the three ints of 1.21.1.
        'com/vyrriox/rspolymorph/mixin/MixinScreenKeyDismiss.java',
]

def remappedJava = layout.buildDirectory.dir('remapped-common/java')
def remapCommonSources = tasks.register('remapCommonSources', Sync) {
    from(new File(sharedDir, 'java')) {
        forkedFor261.each { exclude it }
        filter { String line ->
            line.replaceAll(/\bResourceLocation\b/, 'Identifier')
                .replaceAll(/\bGuiGraphics\b/, 'GuiGraphicsExtractor')
        }
    }
    from(new File(forkDir, 'java'))
    into remappedJava
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

def mergedResources = layout.buildDirectory.dir('merged-resources')
def mergeResources = tasks.register('mergeResources', Sync) {
    from(new File(sharedDir, 'resources')) {
        exclude 'data/rspolymorph/recipe/**'
        exclude 'rspolymorph-common.mixins.json'
    }
    from(new File(forkDir, 'resources'))
    into mergedResources
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

sourceSets.main {
    java.srcDir(remappedJava)
    resources.srcDir(mergedResources)
}

tasks.named('compileJava') { dependsOn remapCommonSources }
tasks.named('processResources') { dependsOn mergeResources }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Refined Storage for Fabric, pinned by its Modrinth version id in gradle.properties.
    implementation "maven.modrinth:refined-storage:${refinedstorage_fabric}"

    // Refined Storage nests these two in its jar for players, but Gradle does not see nested jars:
    // the development runs need them next to it (the same versions as RS 3.2.1 nests).
    localRuntime "maven.modrinth:cloth-config:GFM8zh9J"
    localRuntime "teamreborn:energy:5.0.0"
}

loom {
    runs {
        client { client(); ideConfigGenerated(true); runDir('runs/client') }
        server { server(); ideConfigGenerated(true); runDir('runs/server') }
    }
}

processResources {
    def props = [
            version              : mod_version,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            refinedstorage_min_version: refinedstorage_min_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_author           : mod_author,
            license              : license,
            description          : project.description,
    ]
    inputs.properties(props)
    filesMatching(['fabric.mod.json', 'pack.mcmeta', '*.mixins.json']) { expand props }
}

jar {
    from(file('../LICENSE')) { rename { "${it}_${mod_name}" } }
    from(file('../NOTICE')) { rename { "${it}_${mod_name}" } }
}
