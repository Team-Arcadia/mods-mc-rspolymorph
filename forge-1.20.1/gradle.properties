org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

## Loader
# Built against Forge. NeoForge for 1.20.1 is the 47.1 fork of Forge and loads as the mod "forge",
# so one jar serves both. Pass -PuseNeoForge to compile and run against NeoForge instead.
forge_version=47.4.10
neo_version=47.1.106
forge_version_range=[47,)
loader_version_range=[47,)

## Mod
mod_id=rspolymorph
