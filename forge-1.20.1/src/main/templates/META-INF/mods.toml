modLoader = "javafml"
# Forge and its 1.20.1 fork NeoForge both load through FML 47.
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Team-Arcadia/mods-mc-rspolymorph/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
credits = "${mod_credits}"
description = '''
${mod_description}
'''

# NeoForge 1.20.1 still registers itself as the mod "forge" (47.1.x), so this one range accepts both.
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "refinedstorage"
mandatory = true
versionRange = "${refinedstorage_version_range}"
ordering = "AFTER"
side = "BOTH"
