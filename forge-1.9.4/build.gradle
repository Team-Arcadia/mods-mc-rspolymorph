// ForgeGradle 2.2 on Gradle 3.5.1: start it with a Java 8 JAVA_HOME, it runs on nothing newer.
// Minecraft 1.9.4 on Refined Storage 0.7.19-beta.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.2-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

def targetMc = minecraft_version
def forgeVersion = forge_version
def selftest = project.hasProperty('selftest')
def obfRun = project.hasProperty('obf_run')

group = mod_group_id
version = mod_version
archivesBaseName = "${mod_id}-forge-${minecraft_version}" + (selftest ? '-SELFTEST' : '')
sourceCompatibility = targetCompatibility = 1.8

repositories {
    maven {
        name = 'ForgeMaven'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

// Forks over the closest line, the first folder wins: a file of a later folder that an earlier one
// also holds is left out, so that any other overlap fails the build.
def layers = ['1.9.4', '1.10', '1.10.2', '1.11.2', '1.12', '1.12.2'].collect { new File(rootDir, "../common/${it}/src") }
def assembled = new File(buildDir, 'assembledCommon')

String adaptLine(String line) {
    return line
            .replace('.gameDir', '.mcDataDir')
            .replace('.fontRenderer', '.fontRendererObj')
            .replace('getServerHandler().player', 'getServerHandler().playerEntity')
            .replace('screen.getItemToolTip(stack)', 'stack.getTooltip(net.minecraft.client.Minecraft.getMinecraft().player, net.minecraft.client.Minecraft.getMinecraft().gameSettings.advancedItemTooltips)')
            // The server's log4j console appender does not start in a dev run: write past it.
            .replace('System.out.println("RSP-SELFTEST " + text);', 'new java.io.PrintStream(new java.io.FileOutputStream(java.io.FileDescriptor.out), true).println("RSP-SELFTEST " + text);')
            .replace('refinedstorage.gui.control.SideButton', 'refinedstorage.gui.sidebutton.SideButton')
            .replace('refinedstorage.api.network.grid.GridType', 'refinedstorage.block.GridType')
            .replace('refinedstorage.api.network.grid.IGrid', 'refinedstorage.tile.grid.IGrid')
            .replace('.getGridType()', '.getType()')
            .replace('refinedstorage.block.enums.ControllerType', 'refinedstorage.block.ControllerType')
            .replace('refinedstorage.inventory.item.ItemHandlerBase', 'refinedstorage.inventory.ItemHandlerBase')
            // This Pattern Grid has no processing mode.
            .replace(' && !node.isProcessingPattern()', '')
            // SideButton.drawButton has no partial ticks here.
            .replace('int mouseY, float partialTicks)', 'int mouseY)')
            .replace('mouseX, mouseY, partialTicks)', 'mouseX, mouseY)')
            .replace('(NetworkNodeGrid) ((TileNode<?>) s.worldServerForDimension(0).getTileEntity(pos)).getNode()', '(TileGrid) s.worldServerForDimension(0).getTileEntity(pos)')
            .replace('refinedstorage.tile.TileNode;', 'refinedstorage.tile.grid.TileGrid;')
            .replace('.getCraftingMatrix()', '.getMatrix()')
            .replace('.getCraftingResult()', '.getResult()')
            .replace('refinedstorage.inventory.ItemHandlerBase', 'refinedstorage.inventory.ItemHandlerBasic')
            .replace('(ItemHandlerBase)', '(ItemHandlerBasic)')
            .replace('(GridType ', '(EnumGridType ')
            .replace('com.raoulvdberge.refinedstorage.apiimpl.network.node.NetworkNodeGrid', 'com.raoulvdberge.refinedstorage.tile.grid.TileGrid')
            .replace('com/raoulvdberge/refinedstorage/apiimpl/network/node/NetworkNodeGrid', 'com/raoulvdberge/refinedstorage/tile/grid/TileGrid')
            .replace('NetworkNodeGrid', 'TileGrid')
            .replace('refinedstorage.block.GridType', 'refinedstorage.block.EnumGridType')
            .replace('GridType.', 'EnumGridType.')
            .replace('EnumEnumGridType', 'EnumGridType')
            .replace('refinedstorage.block.ControllerType', 'refinedstorage.block.EnumControllerType')
            .replace('ControllerType', 'EnumControllerType')
            .replace('EnumEnumControllerType', 'EnumControllerType')
            // Refined Storage 0.x has another package and other class names.
            .replace('com.raoulvdberge.refinedstorage.', 'refinedstorage.')
            .replace('com/raoulvdberge/refinedstorage/', 'refinedstorage/')
            .replace('refinedstorage.gui.grid.GuiGrid', 'refinedstorage.gui.GuiGrid')
            .replace('refinedstorage.RS;', 'refinedstorage.RefinedStorage;')
            .replace('refinedstorage.RSBlocks', 'refinedstorage.RefinedStorageBlocks')
            .replace('refinedstorage.RSItems', 'refinedstorage.RefinedStorageItems')
            .replace('RS.INSTANCE.network', 'RefinedStorage.INSTANCE.network')
            .replace('RSBlocks.', 'RefinedStorageBlocks.')
            .replace('RSItems.', 'RefinedStorageItems.')
            .replace('refinedstorage.inventory.ItemHandlerBasic', 'refinedstorage.inventory.BasicItemHandler')
            .replace('(ItemHandlerBasic)', '(BasicItemHandler)')
            .replace('.size() == 6', '.size() == 5')
            .replace('RefinedStorage.INSTANCE.network', 'RefinedStorage.NETWORK')
            // Older names of Minecraft.
            .replace('mc.player', 'mc.thePlayer')
            .replace('mc.thePlayerController', 'mc.playerController')
            .replace('net.minecraft.world.GameType', 'net.minecraft.world.WorldSettings.GameType')
            .replace('mc.world', 'mc.theWorld')
            .replace('getMinecraft().player', 'getMinecraft().thePlayer')
            .replace('slot.xPos', 'slot.xDisplayPosition')
            .replace('slot.yPos', 'slot.yDisplayPosition')
            .replace('.getPlayers()', '.getPlayerList()')
            // containsVersion of this Forge compares labels first, and throws on a version with none.
            // This Forge has no tooltip event, and its hovering text takes no stack.
            .replace('GuiUtils.drawHoveringText(stack, lines,', 'GuiUtils.drawHoveringText(lines,')
            .replace('@IFMLLoadingPlugin.MCVersion("1.12.2")', '@IFMLLoadingPlugin.MCVersion("1.9.4")')
            .replace('containsVersion(new DefaultArtifactVersion("1.12.2"))', 'containsVersion(new DefaultArtifactVersion("1.9.4"))')
            .replace('containsVersion(new DefaultArtifactVersion("1.12.1"))', 'containsVersion(new DefaultArtifactVersion("1.9"))')
            .replace('new DefaultArtifactVersion("1.6.16")', 'new DefaultArtifactVersion("refinedstorage", "0.7.19")')
            .replace('new DefaultArtifactVersion("1.6.15")', 'new DefaultArtifactVersion("refinedstorage", "0.7.18")')
}

task assembleCommonSources(type: Sync) {
    into assembled
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // A filter closure is not a tracked input.
    inputs.file(buildFile)
    def seen = new HashSet<String>()
    layers.each { layer ->
        def forked = new HashSet<String>(seen)
        from(layer) {
            exclude { element -> !element.isDirectory() && forked.contains(element.relativePath.pathString) }
            // This Minecraft reads en_US.lang and fr_FR.lang, the forks hold them.
            exclude '**/lang/en_us.lang', '**/lang/fr_fr.lang'
            filesMatching('**/*.java') {
                filter { String line -> adaptLine(line) }
            }
        }
        fileTree(layer).visit { element ->
            if (!element.isDirectory()) {
                seen.add(element.relativePath.pathString)
            }
        }
    }
}

sourceSets.main.java.srcDir(new File(assembled, 'main/java'))
sourceSets.main.resources.srcDir(new File(assembled, 'main/resources'))
if (selftest) {
    sourceSets.main.java.srcDir(new File(assembled, 'selftest/java'))
}
// FML reads a mod's metadata and assets from the folder of its classes, in a dev run too.
sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDir

tasks.matching { it.name in ['sourceMainJava', 'compileJava', 'processResources'] }.all {
    dependsOn assembleCommonSources
}

def coremods = 'com.vyrriox.rspolymorph.coremod.RsPolymorphCoremod' +
        (selftest ? ',com.vyrriox.rspolymorph.selftest.SelftestCoremod' : '')

minecraft {
    version = "${targetMc}-${forgeVersion}"
    mappings = mcp_mappings
    runDir = 'run'
    // In a dev run FML only finds a coremod that this property names. Never with a jar in a mods
    // folder: the property fails first, and FML's class loader remembers a class it could not find.
    if (!obfRun) {
        clientJvmArgs += "-Dfml.coreMods.load=${coremods}".toString()
    }
    if (selftest) {
        clientJvmArgs += '-Drspolymorph.selftest=true'
        clientJvmArgs += '-Drspolymorph.selftest.server=true'
    }
}

configurations {
    obfForge
    obfMods
}

dependencies {
    // Refined Storage is released in SRG names: this remaps it to the MCP names of the dev run.
    deobfCompile "maven.modrinth:refined-storage:${refinedstorage_version_id}"
    obfForge("net.minecraftforge:forge:${targetMc}-${forgeVersion}:universal@jar") { transitive = false }
    obfMods("maven.modrinth:refined-storage:${refinedstorage_version_id}@jar") { transitive = false }
}

processResources {
    def props = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_author       : mod_author,
            mod_credits      : mod_credits,
            mod_description  : mod_description,
            minecraft_version: minecraft_version
    ]
    inputs.properties(props)
    filesMatching('mcmod.info') {
        expand(props)
    }
}

// The coremod ships in the same jar as the mod: the two attributes tell FML to load both from it.
jar {
    // The resources sit in the folder of the classes, so the output lists them twice.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    manifest {
        attributes(
                'FMLCorePlugin': 'com.vyrriox.rspolymorph.coremod.RsPolymorphCoremod',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_author,
                'Specification-Version': '1',
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_author
        )
    }
}

if (selftest) {
    // The dedicated server half of the selftest. It never starts a server: it takes the same classes
    // down FML's server launch path and stops at the first line of the server's main method, before
    // eula.txt is read (see ServerSelftest).
    task runServerSelftest(type: JavaExec) {
        group = 'verification'
        main = 'GradleStartServer'
        workingDir = file('run/selftest-server')
        jvmArgs "-Dfml.coreMods.load=${coremods}".toString(), '-Drspolymorph.selftest.server=true', '-Xmx1G'
    }
    afterEvaluate {
        def run = tasks.getByName('runServer')
        runServerSelftest.dependsOn run.dependsOn, 'jar'
        runServerSelftest.doFirst {
            workingDir.mkdirs()
            classpath = run.classpath
        }
    }

    // The released form of the mod in a mods folder, the closest proof to a real install: the Forge
    // universal jar and the vanilla client on the class path, Forge's own patches, SRG names, no
    // installer and no dev launcher. -Pselftest -Pobf_run.
    task runObfClient(type: JavaExec) {
        group = 'verification'
        dependsOn 'reobfJar', 'extractNatives'
        main = 'net.minecraft.launchwrapper.Launch'
        def dir = file('run/obf')
        def cache = new File(gradle.gradleUserHomeDir, 'caches/minecraft')
        workingDir = dir
        jvmArgs '-Xmx2G', '-Drspolymorph.selftest=true', '-Dfml.ignoreInvalidMinecraftCertificates=true',
                "-Djava.library.path=${new File(cache, "net/minecraft/natives/${targetMc}")}".toString()
        args '--tweakClass', 'net.minecraftforge.fml.common.launcher.FMLTweaker',
                '--version', 'forge', '--gameDir', dir.path,
                '--assetsDir', new File(cache, 'assets').path, '--assetIndex', '1.9',
                '--accessToken', '0', '--userProperties', '{}', '--userType', 'legacy',
                '--username', 'Dev', '--uuid', '00000000000000000000000000000000'
        doFirst {
            delete new File(dir, 'mods')
            copy {
                from configurations.obfMods
                // -Pobf_jar=<file> runs a jar built earlier, such as the 1.12 build on 1.12.1.
                from project.hasProperty('obf_jar') ? file(project.property('obf_jar')) : jar.archivePath
                into new File(dir, 'mods')
            }
            classpath = configurations.obfForge + configurations.forgeGradleMcDeps +
                    files(new File(cache, "net/minecraft/minecraft/${targetMc}/minecraft-${targetMc}.jar"))
        }
    }
}
