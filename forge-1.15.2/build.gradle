plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Minecraft 1.15.2 runs on Java 8, whatever JDK starts Gradle.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

// Shared with 1.16.5, but for the files that this game's API forces to fork in ../common/1.15.2.
def commonDir = file('../common/1.16.5/src')
def forkDir = file('../common/1.15.2/src')
def forkedMain = [
        'com/vyrriox/rspolymorph/client/Canvas.java',
        'com/vyrriox/rspolymorph/client/RecipeSelectionSideButton.java',
        'com/vyrriox/rspolymorph/mixin/MixinGridScreen.java',
]
def forkedSelftest = [
        'com/vyrriox/rspolymorph/selftest/SelftestCompat.java',
        'com/vyrriox/rspolymorph/selftest/mixin/MixinServerMainSelftest.java',
]

sourceSets.main.resources.srcDir(new File(commonDir, 'main/resources'))

// -PpolymorphJar=<path to a Polymorph+ jar> adds it to the dev runs only, in its own game folder, to prove
// both mods load together. It is never compiled against or shipped.
def polymorphJar = providers.gradleProperty('polymorphJar').map { new File(it) }.getOrNull()

// In-game functional test, only with -Pselftest (see docs/BUILDING.md). A default build compiles and
// packages none of it. The jar gets another name, so that it can never pass for a release.
def selftest = project.hasProperty('selftest')
if (selftest) {
    sourceSets.main.resources.srcDir(new File(commonDir, 'selftest/resources'))
    base.archivesName = "${base.archivesName.get()}-SELFTEST"
}

def assembleCommonSources = tasks.register('assembleCommonSources', Sync) {
    inputs.property('selftest', selftest)
    inputs.file(buildFile)   // the filter below lives in this file
    from(new File(commonDir, 'main/java')) {
        exclude(forkedMain)
    }
    from(new File(forkDir, 'main/java'))
    if (selftest) {
        from(new File(commonDir, 'selftest/java')) {
            exclude(forkedSelftest)
            // A line or two away from 1.16 in a 1600 line file: adapted rather than forked.
            filter { String line ->
                line.replace('mc.player.blockPosition()', 'new net.minecraft.util.math.BlockPos(mc.player)')
                        .replace('ServerModLoader.load();', 'ServerLoad.loadMods();')
            }
        }
        from(new File(forkDir, 'selftest/java'))
    }
    into layout.buildDirectory.dir('assembled-common/java')
    duplicatesStrategy = DuplicatesStrategy.FAIL   // a fork colliding with a shared file is a bug
}
sourceSets.main.java.srcDir(assembleCommonSources)

def runFolder = polymorphJar != null ? 'run-polymorph' : 'run'

minecraft {
    // Mojang's method and field names over the class names of the time (PlayerEntity, IRecipe).
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file(runFolder)
            property 'forge.logging.console.level', 'info'
            // Jars with SRG refmaps (Refined Storage's dependents, Polymorph+) resolve in development too.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
        if (selftest) {
            clientSelftest {
                parent runs.client
                taskName 'runClientSelftest'
                workingDirectory project.file("${runFolder}/selftest")
                property 'rspolymorph.selftest', 'true'
            }
            // The dedicated server distribution. 1.15.2 has no game test launch: the selftest takes over at
            // the first line of the server's main method, before eula.txt is even read, and never starts a
            // server (see ServerSelftest).
            serverSelftest {
                parent runs.server
                taskName 'runServerSelftest'
                workingDirectory project.file("${runFolder}/selftest-server")
                property 'rspolymorph.selftest.server', 'true'
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}-common.mixins.json"
    if (selftest) {
        config "${mod_id}-selftest.mixins.json"
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    if (polymorphJar != null) {
        flatDir {
            dirs polymorphJar.parentFile
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Compile time only: the first processor that reads ForgeGradle 6's TSRG v2. The refmap it writes suits
    // the older Mixin this Forge ships.
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
    // fg.deobf remaps the jar from SRG names to the development mappings.
    implementation fg.deobf("maven.modrinth:refined-storage:${refinedstorage_version_id}")
    if (polymorphJar != null) {
        // A flat folder finds <name>-<version>.jar, and fg.deobf needs a full coordinate.
        def parts = (polymorphJar.name - '.jar') =~ /^(.*?)-(\d.*)$/
        runtimeOnly fg.deobf("local.polymorph:${parts[0][1]}:${parts[0][2]}")
    }
}

def replaceProperties = [
        minecraft_version_range     : minecraft_version_range,
        forge_version_range         : forge_version_range,
        loader_version_range        : loader_version_range,
        refinedstorage_version_range: refinedstorage_version_range,
        mod_id                      : mod_id,
        mod_name                    : mod_name,
        mod_author                  : mod_author,
        mod_version                 : mod_version,
        mod_license                 : mod_license,
        mod_credits                 : mod_credits,
        mod_description             : mod_description,
]
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// These versions run on SRG names outside of development: reobfJar rewrites the jar in place.
tasks.named('jar', Jar).configure {
    from(file('../LICENSE')) {
        rename { "LICENSE_${mod_id}" }
    }
    from(file('../NOTICE')) {
        rename { "NOTICE_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_author,
                // Forge reads mixin configs from the manifest.
                'MixinConfigs'          : "${mod_id}-common.mixins.json" + (selftest ? ",${mod_id}-selftest.mixins.json" : '')
        ])
    }
    finalizedBy 'reobfJar'
}
