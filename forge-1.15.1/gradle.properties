org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
# ForgeGradle keeps the first project of a daemon in a static field: a daemon reused from another target
# fails to set up this Minecraft with "project services has been closed".
org.gradle.daemon=false
org.gradle.parallel=true

## Environment
minecraft_version=1.15.1
minecraft_version_range=[1.15.1]

## Loader
# Newest Forge Refined Storage 1.8 runs on: 30.0.48 renamed Item.Properties.setTEISR, which RS calls from its
# PatternItem, to setISTER, and RS then fails to load with a NoSuchMethodError. 30.0.44 to 30.0.47 were never published.
forge_version=30.0.43
forge_version_range=[30.0.43,30.0.48)
loader_version_range=[30,)

## Mod
mod_id=rspolymorph
mod_name=RS Polymorph
mod_author=vyrriox
mod_version=1.3.0
mod_group_id=com.vyrriox.rspolymorph
mod_license=Apache-2.0
mod_credits=Team Arcadia
mod_description=Standalone recipe selection for the Refined Storage Crafting Grid and Pattern Grid.

## Dependencies
# Refined Storage 1.8.0-beta, Modrinth version id
refinedstorage_version_id=PXGnRC2r
# Written against the beta qualifier, so that the jar's own version satisfies it
refinedstorage_version_range=[1.8.0-beta,)
